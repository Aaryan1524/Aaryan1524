# Single source of truth for the profile page.
#
# Only repos listed here appear in README.md. Forks, class starters and
# experiments stay off the page unless they are added below.
# Every `line:` is Aaryan's own wording. The build script never generates one.

owner: Aaryan1524

# --- build behaviour -------------------------------------------------------
settings:
  # A repo with no push in this many days moves into the collapsed Archive
  # block at the end of the Work section. Nothing is hidden, the page is short.
  archive_after_days: 365
  # detected  -> cells come from the code scan, † marks manual overrides
  # declared  -> cells come from `declared:` below, scan only cross-checks
  table_mode: detected
  # Only repos with real deploy history appear in the table, so the
  # "Idea -> shipped" column never renders a row of dashes. Set false to list
  # every in_matrix repo and show an em dash where nothing shipped.
  matrix_requires_deploy: true

# --- sphere labels ---------------------------------------------------------
# Only things Aaryan will defend in an interview. Order is the order they
# attach to points on the sphere.
skills:
  - Python
  - FastAPI
  - TypeScript
  - React
  - Next.js
  - Neo4j
  - PostgreSQL
  - Docker
  - Java
  - C# / .NET
  - spaCy
  - Claude API

